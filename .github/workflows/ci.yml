name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Tool versions
        run: |
          node --version
          npm --version

      - name: Bootstrap pinned PSD browser bundle
        run: |
          npm pack ag-psd@31.0.2 --silent
          tar -xzf ag-psd-31.0.2.tgz package/dist/bundle.js
          mkdir -p .bootstrap-psd
          cp package/dist/bundle.js .bootstrap-psd/ag-psd-31.0.2.js

      - name: Upload PSD browser bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ag-psd-browser-31.0.2
          path: .bootstrap-psd/ag-psd-31.0.2.js
          if-no-files-found: error

      - name: Build and test
        run: npm run check

      - name: Verify generated bundle is current
        run: git diff --exit-code -- src/app.bundle.js

      - name: Browser smoke (file://)
        run: npm run test:browser

      - name: Diff hygiene
        run: git diff --check