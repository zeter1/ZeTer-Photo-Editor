name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Tool versions
        run: |
          node --version
          npm --version

      - name: Bootstrap pinned PSD browser bundle
        run: |
          npm pack ag-psd@31.0.2 --silent
          tar -xzf ag-psd-31.0.2.tgz package/dist/bundle.js
          mkdir -p .bootstrap-psd
          cp package/dist/bundle.js .bootstrap-psd/ag-psd-31.0.2.js

      - name: Vendor pinned PSD browser bundle and restore read-only CI
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/psd-import-stage3'
        run: |
          mkdir -p vendor/ag-psd
          cp .bootstrap-psd/ag-psd-31.0.2.js vendor/ag-psd/ag-psd-31.0.2.js
          cp package/LICENSE vendor/ag-psd/LICENSE.txt
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/ag-psd/ag-psd-31.0.2.js vendor/ag-psd/LICENSE.txt .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo "Pinned vendor bundle already committed; nothing to do."
          else
            git commit -m "build: vendor ag-psd 31.0.2 browser bundle"
            git push origin HEAD:feature/psd-import-stage3
          fi

      - name: Build and test
        run: npm run check

      - name: Verify generated bundle is current
        run: git diff --exit-code -- src/app.bundle.js

      - name: Browser smoke (file://)
        run: npm run test:browser

      - name: Diff hygiene
        run: git diff --check